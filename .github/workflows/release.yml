name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    env:
      APPLE_DEVELOPER_CERTIFICATE_NAME: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_NAME }}
      APPLE_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_DEVELOPER_APP_PASSWORD: ${{ secrets.APPLE_DEVELOPER_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: myllm

      - uses: actions/checkout@v4
        with:
          repository: rinodrops/settings
          path: settings

      - uses: extractions/setup-just@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dmgbuild
        run: pip install dmgbuild

      - name: Import code signing certificate
        env:
          APPLE_DEVELOPER_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          APPLE_DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$APPLE_DEVELOPER_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -P "$APPLE_DEVELOPER_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            myllm/target
            settings/target
          key: cargo-macos-${{ matrix.arch }}-${{ hashFiles('myllm/Cargo.lock', 'settings/Cargo.lock') }}
          restore-keys: cargo-macos-${{ matrix.arch }}-

      - name: Notarize and zip macOS app
        working-directory: myllm
        run: just darwin-zip-${{ matrix.arch }}

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            myllm/dist/My-LLM-v*-darwin-${{ matrix.arch }}.dmg
            myllm/dist/My-LLM-v*-darwin-${{ matrix.arch }}.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: myllm

      - uses: actions/checkout@v4
        with:
          repository: rinodrops/settings
          path: settings

      - uses: extractions/setup-just@v2

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: choco install imagemagick zip -y

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            myllm/target
            settings/target
          key: cargo-windows-${{ hashFiles('myllm/Cargo.lock', 'settings/Cargo.lock') }}
          restore-keys: cargo-windows-

      - name: Build Windows zip
        working-directory: myllm
        shell: bash
        run: just win-zip

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: myllm/dist/My-LLM-v*-windows-x86_64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve version
        run: |
          VERSION="$(awk -F'"' '/^version *=/{print $2; exit}' Cargo.toml)"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          test "${GITHUB_REF_NAME#v}" = "$VERSION"

      - name: Prepare release notes
        run: |
          {
            echo "## My LLM ${GITHUB_REF_NAME}"
            echo ""
            echo "### macOS"
            echo "- \`My-LLM-v${VERSION}-darwin-arm64.dmg\` / \`.zip\` — notarized"
            echo "- \`My-LLM-v${VERSION}-darwin-x86_64.dmg\` / \`.zip\` — notarized"
            echo ""
            echo "### Windows"
            echo "- \`My-LLM-v${VERSION}-windows-x86_64.zip\` — unsigned"
          } > release-body.md

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: release-body.md
          files: artifacts/**/*
